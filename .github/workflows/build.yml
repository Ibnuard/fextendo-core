name: FEXTendo Core build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Validate installer and boot bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libssl-dev libcurl4-openssl-dev python3-pil
      - name: Prepare official update source
        run: python3 tools/prepare.py
      - name: Validate version and pinned boot payloads
        id: version
        run: python3 tools/release_ci.py metadata
      - name: Test installation, recovery and release guards
        run: |
          bash tools/build-host.sh
          python3 tools/render-previews.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-validation-${{ github.sha }}
          path: |
            build-host/previews/*.png
            build-host/failure-sweep.json
          if-no-files-found: error
          retention-days: 30
  switch-build:
    name: Build FEXTendo Patch NRO
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Official devkitPro image, pinned instead of following a mutable latest tag.
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Prepare offline assets
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update
          apt-get install -y python3-pil
          python3 tools/prepare.py
      - name: Build NRO and package verified assets
        run: |
          bash tools/build-switch.sh
          mkdir -p dist
          dkp-pacman -Q devkitA64 libnx switch-curl switch-zlib > dist/toolchain.txt
          python3 tools/release.py
          python3 tools/release_ci.py verify --input dist/release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FEXTendo-Patch-${{ needs.host-tests.outputs.tag }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  release:
    name: Publish versioned update assets
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'Ibnuard/fextendo-core'
    needs: [host-tests, switch-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: fextendo-core-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: FEXTendo-Patch-${{ needs.host-tests.outputs.tag }}-${{ github.sha }}
          path: dist
      - name: Publish only a new version after checking GitHub asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/release_ci.py publish --input dist/release-assets
