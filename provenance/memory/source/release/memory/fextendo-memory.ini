# FEXTendo Memory 1.0.0 | ABI fxtmem-v1
# Requires Atmosphere 1.11.2 / reference HOS 22.5.0 and an enabled emuMMC.
# HOC 2.5.1 uses its official default configuration.
# This entry overrides ONLY the kernel and Loader from package3.
# Keep pkg3 before kernel/kip1. Do not add another HOC/Loader or a kip1 wildcard.

[FEXTendo (emuMMC)]
id=fxtmem1
pkg3=atmosphere/package3
kernel=atmosphere/fextendo/memory-v1/mesosphere.bin
kip1=atmosphere/fextendo/memory-v1/loader.kip
emummcforce=1
icon=bootloader/res/fextendo-memory.bmp
logopath=bootloader/res/fextendo-boot.bmp
